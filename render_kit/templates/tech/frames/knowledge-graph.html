<!doctype html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;800&display=swap");
#root { position:absolute; inset:0; width:{{width}}px; height:{{height}}px; background:{{bg}}; color:{{fg}}; overflow:hidden; font-family:'Space Grotesk','Inter',sans-serif; }
#main-clip.vertical   { --pad:84px;  --title-size:76px; --node-label:30px; --edge-label:21px; --cap-size:58px; --cap-bottom:170px; --cap-maxw:100%; }
#main-clip.horizontal { --pad:130px; --title-size:70px; --node-label:26px; --edge-label:19px; --cap-size:44px; --cap-bottom:70px;  --cap-maxw:1180px; }

.bg-fill { pointer-events:none; position:absolute; inset:0; background:{{bg}}; }
.bg-grid { pointer-events:none; position:absolute; inset:-140px; opacity:.9;
  background-image:radial-gradient(rgba(230,237,243,.08) 2px, transparent 2px);
  background-size:54px 54px; }

.title { position:absolute; z-index:2; left:var(--pad); right:var(--pad); font-weight:700; font-size:var(--title-size); line-height:1.05; letter-spacing:-1px; }
#main-clip.vertical .title   { top:250px; text-align:center; }
#main-clip.horizontal .title { top:120px; text-align:left; }

.rig { position:absolute; z-index:2; inset:0; }
.kg-edge { position:absolute; height:4px; margin-top:-2px; border-radius:2px; background:rgba(230,237,243,.16); transform-origin:left center; }
.kg-edge.on-path { background:{{accent}}; height:6px; margin-top:-3px; box-shadow:0 0 16px {{accent}}88; }
.kg-edge-label { position:absolute; z-index:2; transform:translate(-50%,-50%); white-space:nowrap; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:var(--edge-label); color:{{fg}}; background:{{bg}}; border:1px solid rgba(230,237,243,.18); border-radius:999px; padding:5px 14px; opacity:0; }
.kg-edge-label.on-path { color:{{bg}}; background:{{accent}}; border-color:{{accent}}; }

.kg-node { position:absolute; z-index:3; background:#161B22; border:2px solid rgba(230,237,243,.18); border-radius:20px; text-align:center; padding:18px 26px; box-shadow:0 14px 36px rgba(0,0,0,.4); white-space:nowrap; }
.kg-node.on-path { border-color:{{accent}}; box-shadow:0 0 40px {{accent}}55; }
.kg-glyph { font-size:34px; line-height:1.1; margin-bottom:4px; }
.kg-label { font-weight:700; font-size:var(--node-label); line-height:1.1; }

.kg-runner { position:absolute; z-index:2; width:26px; height:26px; margin:-13px 0 0 -13px; border-radius:50%; background:{{accent}}; box-shadow:0 0 28px {{accent}}; opacity:0; }

.caption-zone { position:absolute; bottom:var(--cap-bottom); left:0; right:0; display:flex; align-items:center; justify-content:center; z-index:5; }
.caption { position:relative; width:calc(100% - 2*var(--pad)); max-width:var(--cap-maxw); height:2.4em; font-size:var(--cap-size); }
.cap-chunk { position:absolute; width:100%; left:0; top:50%; transform:translateY(-50%); font-family:'Inter',sans-serif; font-weight:800; text-align:center; line-height:1.3; opacity:0; }
.cap-chunk .cw { display:inline-block; white-space:pre; }
.hl { padding:0 .12em; border-radius:10px; background:{{accent}}; color:{{bg}}; }
</style>

<div id="root" data-composition-id="{{id}}" data-width="{{width}}" data-height="{{height}}" data-duration="{{duration}}" data-start="0">
  <section id="main-clip" class="clip main-clip {{orientation}}" data-start="0" data-duration="{{duration}}" data-track-index="1">
    <div class="bg-fill"></div>
    <div class="bg-grid"></div>
    <div class="title">{{title}}</div>
    <div class="rig"></div>
    <div class="caption-zone"><div class="caption"></div></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
(function(){
  var root = document.getElementById('root');
  var W = {{width}}, H = {{height}};
  var DUR = parseFloat('{{duration}}') || 4;
  var VERT = '{{orientation}}' === 'vertical';
  function $(s){ return root.querySelector(s); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function hl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1<\/span>'); }

  var titleEl = $('.title');
  var tt = titleEl.textContent.trim();
  if (!tt) titleEl.style.display = 'none'; else titleEl.innerHTML = hl(tt);

  // Deterministic stage box: fractions scaled to this orientation's canvas.
  var BOX = VERT ? { x0:120, y0:470, x1:960, y1:1500 } : { x0:300, y0:300, x1:1620, y1:870 };
  var BW = BOX.x1 - BOX.x0, BH = BOX.y1 - BOX.y0;

  // Per-count layout tables — hand-placed so 4/5/6 nodes read as a clean
  // shape (diamond / pentagon / hex) rather than a generic ring.
  var LAYOUTS = {
    4: [[0.50,0.06],[0.10,0.42],[0.90,0.42],[0.50,0.86]],
    5: [[0.50,0.04],[0.06,0.36],[0.94,0.36],[0.24,0.90],[0.76,0.90]],
    6: [[0.30,0.04],[0.74,0.06],[0.04,0.38],[0.96,0.40],[0.28,0.80],[0.72,0.86]]
  };

  var ALL_NODES = {{nodes}};
  var ALL_EDGES = {{edges}};
  var RAW_PATH = {{path}};

  var tableKey = Math.max(4, Math.min(6, ALL_NODES.length || 4));
  var L = LAYOUTS[tableKey];
  var NODES = ALL_NODES.slice(0, tableKey);
  var COORDS = NODES.map(function(_, i){
    var f = L[i] || L[L.length - 1];
    return { x: BOX.x0 + f[0] * BW, y: BOX.y0 + f[1] * BH };
  });

  // Edges reference 0-based indices into NODES; drop anything out of range
  // rather than crash on a malformed authoring mistake.
  var EDGES = ALL_EDGES.filter(function(e){
    return Number.isInteger(e.from) && Number.isInteger(e.to) &&
      e.from >= 0 && e.from < NODES.length && e.to >= 0 && e.to < NODES.length && e.from !== e.to;
  });

  // Multi-hop path: use the authored path if valid, else walk the first
  // chain the edges allow — deterministic, based only on input order.
  function defaultPath(){
    if (!EDGES.length) return [];
    var path = [EDGES[0].from, EDGES[0].to];
    for (var iter = 0; iter < 3; iter++){
      var last = path[path.length - 1], next = null;
      for (var e = 0; e < EDGES.length; e++){
        if (EDGES[e].from === last && path.indexOf(EDGES[e].to) === -1) { next = EDGES[e].to; break; }
      }
      if (next === null) break;
      path.push(next);
    }
    return path;
  }
  var PATH = (Array.isArray(RAW_PATH) && RAW_PATH.length >= 2 &&
    RAW_PATH.every(function(i){ return Number.isInteger(i) && i >= 0 && i < NODES.length; }))
    ? RAW_PATH : defaultPath();

  function edgeOnPath(e){
    for (var k = 0; k < PATH.length - 1; k++){
      if ((PATH[k] === e.from && PATH[k+1] === e.to) || (PATH[k] === e.to && PATH[k+1] === e.from)) return true;
    }
    return false;
  }
  function nodeOnPath(i){ return PATH.indexOf(i) !== -1; }

  var rig = $('.rig');

  // Edges (+ their labels) painted first so nodes sit on top.
  var edgeEls = EDGES.map(function(e){
    var p = COORDS[e.from], q = COORDS[e.to];
    var dx = q.x - p.x, dy = q.y - p.y;
    var len = Math.sqrt(dx*dx + dy*dy) || 1;
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    var onPath = edgeOnPath(e);
    var el = document.createElement('div');
    el.className = 'kg-edge' + (onPath ? ' on-path' : '');
    el.style.left = p.x + 'px'; el.style.top = p.y + 'px'; el.style.width = len + 'px';
    rig.appendChild(el);
    // Rotation must live in GSAP's transform state — a later scaleX draw
    // tween would overwrite an inline transform.
    gsap.set(el, { rotation: ang, scaleX: 0, transformOrigin: 'left center' });

    var label = null;
    if (e.label) {
      var mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
      var nx = -dy / len, ny = dx / len;
      label = document.createElement('div');
      label.className = 'kg-edge-label' + (onPath ? ' on-path' : '');
      label.textContent = e.label;
      label.style.left = (mx + nx * 24) + 'px';
      label.style.top = (my + ny * 24) + 'px';
      rig.appendChild(label);
    }
    return { el:el, label:label, onPath:onPath };
  });

  var nodeEls = NODES.map(function(n, i){
    var onPath = nodeOnPath(i);
    var el = document.createElement('div');
    el.className = 'kg-node' + (onPath ? ' on-path' : '');
    el.innerHTML = (n.glyph ? '<div class="kg-glyph">' + esc(n.glyph) + '<\/div>' : '') +
      '<div class="kg-label">' + hl(n.label || '') + '<\/div>';
    el.style.left = COORDS[i].x + 'px'; el.style.top = COORDS[i].y + 'px';
    gsap.set(el, { xPercent:-50, yPercent:-50 });
    rig.appendChild(el);
    return el;
  });

  var runner = document.createElement('div');
  runner.className = 'kg-runner';
  if (PATH.length) {
    runner.style.left = COORDS[PATH[0]].x + 'px';
    runner.style.top = COORDS[PATH[0]].y + 'px';
  }
  rig.insertBefore(runner, nodeEls[0]); // beneath the nodes, above the edges

  var tl = gsap.timeline({ paused:true });
  tl.to($('.bg-grid'), { x:36, y:36, duration:DUR, ease:'none' }, 0);
  tl.fromTo(titleEl, { opacity:0, y:-24 }, { opacity:1, y:0, duration:0.32, ease:'power3.out' }, 0.08);

  // Nodes pop in one at a time so the frame is never fully empty early.
  var popSpan = Math.min(DUR * 0.35, Math.max(0.9, nodeEls.length * 0.16));
  var popPer = popSpan / Math.max(1, nodeEls.length);
  nodeEls.forEach(function(el, i){
    tl.fromTo(el, { opacity:0, scale:0.5 }, { opacity:1, scale:1, duration:0.28, ease:'back.out(1.9)' }, 0.2 + i * popPer);
  });

  // Then edges + labels draw between the settled nodes.
  var edgesAt = 0.2 + popSpan + 0.15;
  var edgeSpan = Math.min(DUR * 0.3, Math.max(0.8, edgeEls.length * 0.14));
  var edgePer = edgeSpan / Math.max(1, edgeEls.length);
  edgeEls.forEach(function(e, i){
    var at = edgesAt + i * edgePer;
    tl.to(e.el, { scaleX:1, duration:0.26, ease:'power2.out' }, at);
    if (e.label) tl.fromTo(e.label, { opacity:0 }, { opacity:1, duration:0.2 }, at + 0.12);
  });

  // The traversal beat: a runner travels the multi-hop path, lighting up
  // each node/edge pair it lands on in accent.
  var travelAt = edgesAt + edgeSpan + 0.25;
  if (PATH.length > 1) {
    var hopDur = Math.max(0.35, Math.min(0.6, (DUR - travelAt - 0.4) / (PATH.length - 1)));
    tl.fromTo(runner, { opacity:0, scale:0.4 }, { opacity:1, scale:1, duration:0.2 }, travelAt);
    var base = COORDS[PATH[0]];
    for (var k = 0; k < PATH.length - 1; k++) {
      var target = COORDS[PATH[k+1]];
      tl.to(runner, { x: target.x - base.x, y: target.y - base.y, duration: hopDur, ease:'none' }, travelAt + 0.2 + k * hopDur);
    }
    tl.to(runner, { opacity:0, scale:1.5, duration:0.2 }, travelAt + 0.2 + (PATH.length - 1) * hopDur);
    // B-roll: the final path node glows for the remainder of the scene.
    var idleAt = travelAt + 0.4 + (PATH.length - 1) * hopDur;
    var lastNode = nodeEls[PATH[PATH.length - 1]];
    var pulses = Math.max(1, Math.floor((DUR - idleAt) / 0.8));
    if (lastNode) tl.to(lastNode, { scale:1.06, duration:0.4, ease:'sine.inOut', repeat:pulses * 2 - 1, yoyo:true }, idleAt);
  }

  var CT = {{captionTiming}};
  var capHost = $('.caption');
  var caps = (Array.isArray(CT) ? CT : []).map(function(c){
    var d = document.createElement('div');
    d.className = 'cap-chunk';
    var ws = Array.isArray(c.words) ? c.words : [];
    d.innerHTML = ws.length
      ? ws.map(function(w){ return '<span class="cw">' + hl(w.text) + ' </span>'; }).join('')
      : hl(c.text);
    capHost.appendChild(d);
    return d;
  });
  caps.forEach(function(el, i){
    var t = CT[i]; if(!t) return;
    if(i < caps.length - 1){
      var nextStart = CT[i+1] ? CT[i+1].start : t.end;
      var gap = Math.max(0.02, nextStart - t.start);
      var fadeOutDur = Math.min(0.12, gap);
      var fadeInDur = Math.min(i===0?0.2:0.18, Math.max(0.01, gap - fadeOutDur));
      tl.to(el, { opacity:1, duration:fadeInDur }, t.start);
      tl.to(el, { opacity:0, duration:fadeOutDur }, nextStart - fadeOutDur);
    } else {
      tl.to(el, { opacity:1, duration:i===0?0.2:0.18 }, t.start);
    }
    // Karaoke: only the word being spoken holds the highlight color; every
    // other word keeps the normal caption color. Emphasis pills (.hl) opt out.
    var ws = Array.isArray(t.words) ? t.words : [];
    var spans = el.querySelectorAll('.cw');
    ws.forEach(function(w, wi){
      var span = spans[wi]; if(!span || span.querySelector('.hl')) return;
      tl.to(span, { color:'{{capHighlight}}', duration:0.12, ease:'power2.out' }, w.start);
      tl.to(span, { color:'{{fg}}', duration:0.15 }, Math.max(w.start + 0.12, w.end));
    });
  });

  window.__timelines['{{id}}'] = tl;
})();
</script>
</template>
</body>
</html>
</content>
