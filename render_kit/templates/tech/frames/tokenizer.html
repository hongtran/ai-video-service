<!doctype html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;800&display=swap");
#root { position:absolute; inset:0; width:{{width}}px; height:{{height}}px; background:{{bg}}; color:{{fg}}; overflow:hidden; font-family:'Space Grotesk','Inter',sans-serif; }
#main-clip.vertical   { --pad:84px;  --title-size:76px; --cap-size:58px; --cap-bottom:170px; --cap-maxw:100%; }
#main-clip.horizontal { --pad:130px; --title-size:70px; --cap-size:44px; --cap-bottom:70px;  --cap-maxw:1180px; }

.bg-fill { pointer-events:none; position:absolute; inset:0; background:{{bg}}; }
.bg-grid { pointer-events:none; position:absolute; inset:-140px; opacity:.9;
  background-image:radial-gradient(rgba(230,237,243,.08) 2px, transparent 2px);
  background-size:54px 54px; }

.title { position:absolute; z-index:2; left:var(--pad); right:var(--pad); font-weight:700; font-size:var(--title-size); line-height:1.05; letter-spacing:-1px; }
#main-clip.vertical .title   { top:250px; text-align:center; }
#main-clip.horizontal .title { top:120px; text-align:left; }

.tz-stage { position:absolute; z-index:2; inset:0; }
.tz-chip { position:absolute; top:0; background:#161B22; border:2px solid rgba(230,237,243,.18); border-radius:14px; text-align:center; white-space:nowrap; font-family:'JetBrains Mono',monospace; font-weight:700; color:{{fg}}; box-shadow:0 10px 26px rgba(0,0,0,.35); }
.tz-id { position:absolute; text-align:center; font-family:'JetBrains Mono',monospace; font-weight:700; color:{{accent}}; opacity:0; }
.tz-split { position:absolute; width:0; border-left:3px dashed rgba(230,237,243,.35); transform-origin:top center; }

.caption-zone { position:absolute; bottom:var(--cap-bottom); left:0; right:0; display:flex; align-items:center; justify-content:center; z-index:5; }
.caption { position:relative; width:calc(100% - 2*var(--pad)); max-width:var(--cap-maxw); height:2.4em; font-size:var(--cap-size); }
.cap-chunk { position:absolute; width:100%; left:0; top:50%; transform:translateY(-50%); font-family:'Inter',sans-serif; font-weight:800; text-align:center; line-height:1.3; opacity:0; }
.cap-chunk .cw { display:inline-block; white-space:pre; }
.hl { padding:0 .12em; border-radius:10px; background:{{accent}}; color:{{bg}}; }
</style>

<div id="root" data-composition-id="{{id}}" data-width="{{width}}" data-height="{{height}}" data-duration="{{duration}}" data-start="0">
  <section id="main-clip" class="clip main-clip {{orientation}}" data-start="0" data-duration="{{duration}}" data-track-index="1">
    <div class="bg-fill"></div>
    <div class="bg-grid"></div>
    <div class="title">{{title}}</div>
    <div class="tz-stage"></div>
    <div class="caption-zone"><div class="caption"></div></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
(function(){
  var root = document.getElementById('root');
  var W = {{width}}, H = {{height}};
  var DUR = parseFloat('{{duration}}') || 4;
  var VERT = '{{orientation}}' === 'vertical';
  function $(s){ return root.querySelector(s); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function hl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1<\/span>'); }

  var titleEl = $('.title');
  var tt = titleEl.textContent.trim();
  if (!tt) titleEl.style.display = 'none'; else titleEl.innerHTML = hl(tt);

  var TOKENS = {{tokens}};
  var RAW_IDS = {{tokenIds}};
  var n = TOKENS.length;

  // Deterministic illustrative token id: a fixed hash of the string, not
  // Math.random — reproducible across renders, used only when authored
  // tokenIds is missing or short.
  function fakeId(s){
    var h = 0;
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 90000;
    return 1000 + (h % 9000);
  }
  var IDS = TOKENS.map(function(t, i){
    var v = Array.isArray(RAW_IDS) ? Number(RAW_IDS[i]) : NaN;
    return Number.isFinite(v) ? v : fakeId(t);
  });

  // Arithmetic layout — no DOM measurement. Font size fit from total chars
  // so the whole row (plus per-chip padding budget) clears the usable width.
  function fitFont(chars, usableW, baseFs, adv, gutterEm){
    return Math.max(22, Math.min(baseFs, Math.floor(usableW / (adv * chars + gutterEm))));
  }
  var usableW = VERT ? (W - 2 * 100) : (W - 2 * 160);
  var totalChars = TOKENS.reduce(function(m, t){ return m + String(t).length; }, 0);
  var baseFs = VERT ? 46 : 42;
  var ADV = 0.60;
  var fs = fitFont(totalChars, usableW, baseFs, ADV, 1.15 * n);
  var padX = fs * 0.6, chipH = Math.round(fs * 1.15 + fs * 0.7);
  var mergedGap = Math.max(2, Math.round(fs * 0.05));
  var splitGap = Math.round(fs * 0.55);

  var widths = TOKENS.map(function(t){ return Math.round(fs * ADV * String(t).length + padX); });
  function layout(gap){
    var total = widths.reduce(function(a, b){ return a + b; }, 0) + gap * (n - 1);
    var left0 = W / 2 - total / 2;
    var pos = [];
    var cur = left0;
    for (var i = 0; i < n; i++) { pos.push(cur); cur += widths[i] + gap; }
    return pos;
  }
  var mergedX = layout(mergedGap);
  var splitX = layout(splitGap);

  var rowY = VERT ? 900 : 560;
  var stage = $('.tz-stage');

  var chipEls = TOKENS.map(function(t, i){
    var el = document.createElement('div');
    el.className = 'tz-chip';
    el.textContent = t;
    el.style.left = mergedX[i] + 'px';
    el.style.top = (rowY - chipH / 2) + 'px';
    el.style.width = widths[i] + 'px';
    el.style.height = chipH + 'px';
    el.style.lineHeight = chipH + 'px';
    el.style.fontSize = fs + 'px';
    stage.appendChild(el);
    return el;
  });
  var idEls = TOKENS.map(function(t, i){
    var el = document.createElement('div');
    el.className = 'tz-id';
    el.style.left = splitX[i] + 'px';
    el.style.top = (rowY + chipH / 2 + 14) + 'px';
    el.style.width = widths[i] + 'px';
    el.style.fontSize = Math.round(fs * 0.42) + 'px';
    el.textContent = '0';
    stage.appendChild(el);
    return el;
  });
  // Split lines sit at the midpoint of each SPLIT gap — they only need to
  // exist between tokens, so there are n-1 of them.
  var splitEls = [];
  for (var i = 0; i < n - 1; i++) {
    var gapMid = splitX[i] + widths[i] + splitGap / 2;
    var el = document.createElement('div');
    el.className = 'tz-split';
    el.style.left = gapMid + 'px';
    el.style.top = (rowY - chipH / 2 - 22) + 'px';
    el.style.height = (chipH + 44) + 'px';
    stage.appendChild(el);
    splitEls.push(el);
  }

  var tl = gsap.timeline({ paused:true });
  tl.to($('.bg-grid'), { x:36, y:36, duration:DUR, ease:'none' }, 0);
  tl.fromTo(titleEl, { opacity:0, y:-24 }, { opacity:1, y:0, duration:0.32, ease:'power3.out' }, 0.08);

  // The phrase "slams in" as one merged block — chips land tight together.
  tl.fromTo(chipEls, { opacity:0, scale:0.75, y:-14 }, { opacity:1, scale:1, y:0, duration:0.3, stagger:0.025, ease:'back.out(2)' }, 0.2);

  // Hold merged, then split: chips slide apart and the dashed boundaries drop.
  var splitAt = 0.2 + n * 0.025 + 0.35;
  chipEls.forEach(function(el, i){
    tl.to(el, { left: splitX[i], duration:0.42, ease:'power3.out' }, splitAt);
  });
  splitEls.forEach(function(el, i){
    tl.fromTo(el, { opacity:0, scaleY:0 }, { opacity:1, scaleY:1, duration:0.3, ease:'power2.out' }, splitAt + 0.12);
  });

  // Token IDs count up beneath each chip.
  var idsAt = splitAt + 0.5;
  idEls.forEach(function(el, i){
    var counter = { v: 0 };
    tl.to(el, { opacity:1, duration:0.15 }, idsAt + i * 0.06);
    tl.to(counter, {
      v: IDS[i], duration:0.4, ease:'power1.out',
      onUpdate: function(){ el.textContent = Math.round(counter.v); },
    }, idsAt + i * 0.06);
  });

  // B-roll: the whole row breathes gently for the remainder of the scene.
  var idleAt = idsAt + 0.6;
  var pulses = Math.max(1, Math.floor((DUR - idleAt) / 0.9));
  tl.to(stage, { y:-6, duration:0.45, ease:'sine.inOut', repeat:pulses * 2 - 1, yoyo:true }, idleAt);

  var CT = {{captionTiming}};
  var capHost = $('.caption');
  var caps = (Array.isArray(CT) ? CT : []).map(function(c){
    var d = document.createElement('div');
    d.className = 'cap-chunk';
    var ws = Array.isArray(c.words) ? c.words : [];
    d.innerHTML = ws.length
      ? ws.map(function(w){ return '<span class="cw">' + hl(w.text) + ' </span>'; }).join('')
      : hl(c.text);
    capHost.appendChild(d);
    return d;
  });
  caps.forEach(function(el, i){
    var t = CT[i]; if(!t) return;
    if(i < caps.length - 1){
      var nextStart = CT[i+1] ? CT[i+1].start : t.end;
      var gap = Math.max(0.02, nextStart - t.start);
      var fadeOutDur = Math.min(0.12, gap);
      var fadeInDur = Math.min(i===0?0.2:0.18, Math.max(0.01, gap - fadeOutDur));
      tl.to(el, { opacity:1, duration:fadeInDur }, t.start);
      tl.to(el, { opacity:0, duration:fadeOutDur }, nextStart - fadeOutDur);
    } else {
      tl.to(el, { opacity:1, duration:i===0?0.2:0.18 }, t.start);
    }
    // Karaoke: only the word being spoken holds the highlight color; every
    // other word keeps the normal caption color. Emphasis pills (.hl) opt out.
    var ws = Array.isArray(t.words) ? t.words : [];
    var spans = el.querySelectorAll('.cw');
    ws.forEach(function(w, wi){
      var span = spans[wi]; if(!span || span.querySelector('.hl')) return;
      tl.to(span, { color:'{{capHighlight}}', duration:0.12, ease:'power2.out' }, w.start);
      tl.to(span, { color:'{{fg}}', duration:0.15 }, Math.max(w.start + 0.12, w.end));
    });
  });

  window.__timelines['{{id}}'] = tl;
})();
</script>
</template>
</body>
</html>
</content>
