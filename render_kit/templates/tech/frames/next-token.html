<!doctype html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;800&display=swap");
#root { position:absolute; inset:0; width:{{width}}px; height:{{height}}px; background:{{bg}}; color:{{fg}}; overflow:hidden; font-family:'Space Grotesk','Inter',sans-serif; }
#main-clip.vertical   { --pad:84px;  --title-size:76px; --prompt-size:48px; --bar-label:30px; --bar-pct:28px; --cap-size:58px; --cap-bottom:170px; --cap-maxw:100%; }
#main-clip.horizontal { --pad:130px; --title-size:70px; --prompt-size:42px; --bar-label:27px; --bar-pct:25px; --cap-size:44px; --cap-bottom:70px;  --cap-maxw:1180px; }

.bg-fill { pointer-events:none; position:absolute; inset:0; background:{{bg}}; }
.bg-grid { pointer-events:none; position:absolute; inset:-140px; opacity:.9;
  background-image:radial-gradient(rgba(230,237,243,.08) 2px, transparent 2px);
  background-size:54px 54px; }

.title { position:absolute; z-index:2; left:var(--pad); right:var(--pad); font-weight:700; font-size:var(--title-size); line-height:1.05; letter-spacing:-1px; }
#main-clip.vertical .title   { top:250px; text-align:center; }
#main-clip.horizontal .title { top:120px; text-align:left; }

.np-prompt { position:absolute; z-index:2; font-family:'Inter',sans-serif; font-weight:800; line-height:1.35; display:flex; flex-wrap:wrap; align-items:baseline; }
#main-clip.vertical .np-prompt   { left:var(--pad); right:var(--pad); top:470px; font-size:var(--prompt-size); }
#main-clip.horizontal .np-prompt { left:300px; width:620px; top:340px; font-size:var(--prompt-size); }
.np-word { margin:0 .12em; }
.np-blank { display:inline-block; min-width:1.5em; height:1em; margin:0 .12em; border-bottom:5px dashed {{accent}}; }

.np-chart { position:absolute; z-index:2; }
#main-clip.vertical .np-chart   { left:150px; top:820px; }
#main-clip.horizontal .np-chart { left:1020px; top:340px; }
.np-row { position:absolute; display:flex; align-items:center; opacity:0; }
.np-label { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:var(--bar-label); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.np-track { position:relative; background:rgba(230,237,243,.08); border-radius:999px; overflow:hidden; margin-left:20px; }
.np-fill { position:absolute; left:0; top:0; bottom:0; width:0; border-radius:999px; background:rgba(230,237,243,.35); transform-origin:left center; }
.np-row.winner .np-fill { background:{{accent}}; }
.np-pct { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:var(--bar-pct); opacity:.7; margin-left:18px; white-space:nowrap; }
.np-row.winner .np-pct { opacity:1; color:{{accent}}; }

.np-flyer { position:absolute; z-index:1; font-family:'Inter',sans-serif; font-weight:800; color:{{accent}}; white-space:nowrap; opacity:0; pointer-events:none; }

.caption-zone { position:absolute; bottom:var(--cap-bottom); left:0; right:0; display:flex; align-items:center; justify-content:center; z-index:5; }
.caption { position:relative; width:calc(100% - 2*var(--pad)); max-width:var(--cap-maxw); height:2.4em; font-size:var(--cap-size); }
.cap-chunk { position:absolute; width:100%; left:0; top:50%; transform:translateY(-50%); font-family:'Inter',sans-serif; font-weight:800; text-align:center; line-height:1.3; opacity:0; }
.cap-chunk .cw { display:inline-block; white-space:pre; }
.hl { padding:0 .12em; border-radius:10px; background:{{accent}}; color:{{bg}}; }
</style>

<div id="root" data-composition-id="{{id}}" data-width="{{width}}" data-height="{{height}}" data-duration="{{duration}}" data-start="0">
  <section id="main-clip" class="clip main-clip {{orientation}}" data-start="0" data-duration="{{duration}}" data-track-index="1">
    <div class="bg-fill"></div>
    <div class="bg-grid"></div>
    <div class="title">{{title}}</div>
    <span class="sentence-src" hidden>{{sentence}}</span>
    <div class="np-prompt"></div>
    <div class="np-chart"></div>
    <div class="caption-zone"><div class="caption"></div></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
(function(){
  var root = document.getElementById('root');
  var W = {{width}}, H = {{height}};
  var DUR = parseFloat('{{duration}}') || 4;
  var VERT = '{{orientation}}' === 'vertical';
  function $(s){ return root.querySelector(s); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function hl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1<\/span>'); }
  function fitFont(chars, usableW, baseFs, adv, gutterEm){
    return Math.max(18, Math.min(baseFs, Math.floor(usableW / (adv * chars + gutterEm))));
  }

  var titleEl = $('.title');
  var tt = titleEl.textContent.trim();
  if (!tt) titleEl.style.display = 'none'; else titleEl.innerHTML = hl(tt);

  // Free text rides in via a hidden DOM node (apostrophe-safe), never a JS
  // string literal — JS must split it on the blank marker.
  var SENTENCE = $('.sentence-src').textContent.trim();
  var parts = SENTENCE.split('___');
  var PREFIX = (parts[0] || '').trim();
  var SUFFIX = (parts.length > 1 ? parts.slice(1).join('___') : '').trim();

  var ROUNDS_RAW = {{rounds}};
  var ROUNDS = ROUNDS_RAW.filter(function(r){ return r && Array.isArray(r.candidates) && r.candidates.length; });

  // Prompt font: fit from the FINAL sentence length (prefix + every round's
  // winning word + suffix), not the current partial state.
  var estLen = PREFIX.length + SUFFIX.length + ROUNDS.reduce(function(s, r){
    return s + (r.candidates[0].token || '').length + 1;
  }, 0);
  var promptUsableW = VERT ? (W - 2 * 84) : 620;
  var basePromptFs = VERT ? 48 : 42;
  var promptFs = fitFont(estLen, promptUsableW, basePromptFs, 0.56, 1.5);
  var promptEl = $('.np-prompt');
  promptEl.style.fontSize = promptFs + 'px';

  var prefixSpan = document.createElement('span');
  prefixSpan.className = 'np-word';
  prefixSpan.innerHTML = hl(PREFIX);
  var blankEl = document.createElement('span');
  blankEl.className = 'np-blank';
  var suffixSpan = document.createElement('span');
  suffixSpan.className = 'np-word';
  suffixSpan.innerHTML = hl(SUFFIX);
  promptEl.appendChild(prefixSpan);
  promptEl.appendChild(blankEl);
  promptEl.appendChild(suffixSpan);

  // Defensive fit: if the estimate under-shoots (long candidate tokens),
  // scale the whole prompt block down to clear the caption band — same net
  // used by code-snippet's window and pipeline's flow.
  var promptFitWrap = document.createElement('div');
  promptFitWrap.style.cssText = 'position:absolute; inset:0; z-index:2;';
  promptEl.parentNode.insertBefore(promptFitWrap, promptEl);
  promptFitWrap.appendChild(promptEl);
  function fitPrompt(){
    gsap.set(promptFitWrap, { clearProps:'transform' });
    var rootR = root.getBoundingClientRect();
    var k = (rootR.width / W) || 1;
    var r = promptEl.getBoundingClientRect();
    var bottom = (r.bottom - rootR.top) / k;
    var limit = VERT ? 780 : 620;
    if (bottom > limit) gsap.set(promptFitWrap, { scale: Math.max(0.6, (limit - (r.top - rootR.top) / k) / (r.height / k)), transformOrigin: '0 0' });
  }
  fitPrompt();
  if (document.fonts) document.fonts.ready.then(fitPrompt);

  var chartHost = $('.np-chart');
  var rowH = VERT ? 120 : 110;
  var labelCol = VERT ? 220 : 200;
  var trackW = VERT ? 520 : 460;
  var trackH = VERT ? 46 : 40;

  var tl = gsap.timeline({ paused:true });
  tl.to($('.bg-grid'), { x:36, y:36, duration:DUR, ease:'none' }, 0);
  tl.fromTo(titleEl, { opacity:0, y:-24 }, { opacity:1, y:0, duration:0.32, ease:'power3.out' }, 0.08);
  tl.fromTo(promptFitWrap, { opacity:0, y:-14 }, { opacity:1, y:0, duration:0.3, ease:'power2.out' }, 0.2);
  tl.fromTo(blankEl, { opacity:0.3 }, { opacity:1, duration:0.4, ease:'sine.inOut', yoyo:true, repeat:3 }, 0.35);

  var roundsAt = 0.55;
  var roundSpan = Math.max(1.1, Math.min(2.1, (DUR - roundsAt - 0.3) / Math.max(1, ROUNDS.length)));

  ROUNDS.forEach(function(round, ri){
    var t0 = roundsAt + ri * roundSpan;
    var cands = round.candidates.slice(0, 4);
    var maxProb = cands.reduce(function(m, c){ return Math.max(m, Number(c.prob) || 0); }, 0.0001);

    var rows = cands.map(function(c, i){
      var isWinner = i === 0;
      var row = document.createElement('div');
      row.className = 'np-row' + (isWinner ? ' winner' : '');
      row.style.left = '0px';
      row.style.top = (i * rowH) + 'px';
      row.innerHTML =
        '<div class="np-label" style="width:' + labelCol + 'px">' + esc(c.token || '') + '<\/div>' +
        '<div class="np-track" style="width:' + trackW + 'px; height:' + trackH + 'px"><div class="np-fill"><\/div><\/div>' +
        '<div class="np-pct"><\/div>';
      chartHost.appendChild(row);
      return { el: row, fill: row.querySelector('.np-fill'), pct: row.querySelector('.np-pct'), prob: Number(c.prob) || 0, token: c.token || '', isWinner: isWinner };
    });

    // Bars appear and race out to their normalized width — the leader is
    // always full-width so the winner never depends on cross-round scale.
    rows.forEach(function(r, i){
      var w = trackW * (r.prob / maxProb);
      tl.to(r.el, { opacity:1, duration:0.22, ease:'power2.out' }, t0 + i * 0.08);
      tl.fromTo(r.fill, { width:0 }, { width:w, duration:0.35, ease:'power3.out' }, t0 + i * 0.08 + 0.05);
      var counter = { v: 0 };
      tl.to(counter, {
        v: r.prob * 100, duration:0.35, ease:'power3.out',
        onUpdate: function(){ r.pct.textContent = Math.round(counter.v) + '%'; },
      }, t0 + i * 0.08 + 0.05);
    });

    // The winner flies from its bar up into the sentence — a clone (never
    // the real element) so nothing the inspector already scored disappears
    // mid-flight; it fades out exactly as the real inserted word fades in.
    var flyAt = t0 + cands.length * 0.08 + 0.45;
    var winner = rows[0];
    var flyer = document.createElement('div');
    flyer.className = 'np-flyer';
    flyer.textContent = winner.token;
    flyer.style.fontSize = promptFs + 'px';
    root.querySelector('#main-clip').insertBefore(flyer, promptFitWrap);
    var startX = (VERT ? 150 : 1020) + labelCol + 20;
    var startY = (VERT ? 820 : 340);
    var endX = VERT ? W / 2 : 300 + 200;
    var endY = VERT ? 470 : 340;
    flyer.style.left = startX + 'px';
    flyer.style.top = startY + 'px';

    var wordSpan = document.createElement('span');
    wordSpan.className = 'np-word';
    wordSpan.textContent = winner.token;
    wordSpan.style.opacity = 0;
    promptEl.insertBefore(wordSpan, blankEl);

    tl.fromTo(flyer, { opacity:0, scale:0.7 }, { opacity:1, scale:1, duration:0.15 }, flyAt);
    tl.to(flyer, { left:endX, top:endY, duration:0.35, ease:'power2.in' }, flyAt);
    tl.to(flyer, { opacity:0, duration:0.15 }, flyAt + 0.3);
    tl.to(wordSpan, { opacity:1, duration:0.15 }, flyAt + 0.32);
    tl.fromTo(promptFitWrap, { scale: '+=0.03' }, { scale: '-=0.03', duration:0.18, ease:'power2.out' }, flyAt + 0.3);

    // Chart clears before the next round (or lingers if this was the last).
    var clearAt = t0 + roundSpan - 0.25;
    if (ri < ROUNDS.length - 1) {
      tl.to(rows.map(function(r){ return r.el; }), { opacity:0, duration:0.2 }, clearAt);
    }
  });

  var CT = {{captionTiming}};
  var capHost = $('.caption');
  var caps = (Array.isArray(CT) ? CT : []).map(function(c){
    var d = document.createElement('div');
    d.className = 'cap-chunk';
    var ws = Array.isArray(c.words) ? c.words : [];
    d.innerHTML = ws.length
      ? ws.map(function(w){ return '<span class="cw">' + hl(w.text) + ' </span>'; }).join('')
      : hl(c.text);
    capHost.appendChild(d);
    return d;
  });
  caps.forEach(function(el, i){
    var t = CT[i]; if(!t) return;
    if(i < caps.length - 1){
      var nextStart = CT[i+1] ? CT[i+1].start : t.end;
      var gap = Math.max(0.02, nextStart - t.start);
      var fadeOutDur = Math.min(0.12, gap);
      var fadeInDur = Math.min(i===0?0.2:0.18, Math.max(0.01, gap - fadeOutDur));
      tl.to(el, { opacity:1, duration:fadeInDur }, t.start);
      tl.to(el, { opacity:0, duration:fadeOutDur }, nextStart - fadeOutDur);
    } else {
      tl.to(el, { opacity:1, duration:i===0?0.2:0.18 }, t.start);
    }
    // Karaoke: only the word being spoken holds the highlight color; every
    // other word keeps the normal caption color. Emphasis pills (.hl) opt out.
    var ws = Array.isArray(t.words) ? t.words : [];
    var spans = el.querySelectorAll('.cw');
    ws.forEach(function(w, wi){
      var span = spans[wi]; if(!span || span.querySelector('.hl')) return;
      tl.to(span, { color:'{{capHighlight}}', duration:0.12, ease:'power2.out' }, w.start);
      tl.to(span, { color:'{{fg}}', duration:0.15 }, Math.max(w.start + 0.12, w.end));
    });
  });

  window.__timelines['{{id}}'] = tl;
})();
</script>
</template>
</body>
</html>
</content>
