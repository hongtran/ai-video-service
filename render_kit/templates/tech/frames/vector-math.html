<!doctype html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;800&display=swap");
#root { position:absolute; inset:0; width:{{width}}px; height:{{height}}px; background:{{bg}}; color:{{fg}}; overflow:hidden; font-family:'Space Grotesk','Inter',sans-serif; }
#main-clip.vertical   { --pad:84px;  --title-size:76px; --label-size:32px; --formula-size:36px; --cap-size:58px; --cap-bottom:170px; --cap-maxw:100%; }
#main-clip.horizontal { --pad:130px; --title-size:70px; --label-size:29px; --formula-size:32px; --cap-size:44px; --cap-bottom:70px;  --cap-maxw:1180px; }

.bg-fill { pointer-events:none; position:absolute; inset:0; background:{{bg}}; }
.bg-grid { pointer-events:none; position:absolute; inset:-140px; opacity:.9;
  background-image:radial-gradient(rgba(230,237,243,.08) 2px, transparent 2px);
  background-size:54px 54px; }

.title { position:absolute; z-index:2; left:var(--pad); right:var(--pad); font-weight:700; font-size:var(--title-size); line-height:1.05; letter-spacing:-1px; }
#main-clip.vertical .title   { top:250px; text-align:center; }
#main-clip.horizontal .title { top:120px; text-align:left; }

.vm-plot { position:absolute; z-index:2; border:2px solid rgba(230,237,243,.14); border-radius:30px; background:rgba(230,237,243,.02); }
#main-clip.vertical .vm-plot   { left:84px;  top:500px; width:912px;  height:800px; }
#main-clip.horizontal .vm-plot { left:340px; top:280px; width:1000px; height:520px; }

.vm-origin { position:absolute; width:16px; height:16px; margin:-8px 0 0 -8px; border-radius:50%; background:rgba(230,237,243,.4); }
.vm-shaft { position:absolute; height:6px; margin-top:-3px; border-radius:3px; transform-origin:left center; background:{{fg}}88; }
.vm-shaft.dashed { background:repeating-linear-gradient(90deg, {{fg}}88 0 14px, transparent 14px 24px); }
.vm-shaft.result { background:{{accent}}; box-shadow:0 0 16px {{accent}}88; height:8px; margin-top:-4px; }
.vm-head { position:absolute; width:0; height:0; border-top:13px solid transparent; border-bottom:13px solid transparent; border-left:22px solid {{fg}}88; margin:-13px 0 0 -22px; }
.vm-head.result { border-left-color:{{accent}}; }
.vm-label { position:absolute; z-index:3; transform:translate(-50%,-50%); white-space:nowrap; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:var(--label-size); background:{{bg}}; border:1px solid rgba(230,237,243,.18); border-radius:999px; padding:8px 18px; opacity:0; }
.vm-label.result { color:{{bg}}; background:{{accent}}; border-color:{{accent}}; }
.vm-sub-badge { position:absolute; z-index:3; width:30px; height:30px; margin:-15px 0 0 -15px; border-radius:50%; background:{{bg}}; border:2px solid {{fg}}88; color:{{fg}}; font-weight:800; font-size:22px; display:flex; align-items:center; justify-content:center; opacity:0; }

.vm-formula { position:absolute; z-index:2; text-align:center; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:var(--formula-size); opacity:0; }
#main-clip.vertical .vm-formula   { left:var(--pad); right:var(--pad); top:1330px; }
#main-clip.horizontal .vm-formula { left:340px; width:1000px; top:820px; }
.vm-formula .res { color:{{accent}}; }

.caption-zone { position:absolute; bottom:var(--cap-bottom); left:0; right:0; display:flex; align-items:center; justify-content:center; z-index:5; }
.caption { position:relative; width:calc(100% - 2*var(--pad)); max-width:var(--cap-maxw); height:2.4em; font-size:var(--cap-size); }
.cap-chunk { position:absolute; width:100%; left:0; top:50%; transform:translateY(-50%); font-family:'Inter',sans-serif; font-weight:800; text-align:center; line-height:1.3; opacity:0; }
.cap-chunk .cw { display:inline-block; white-space:pre; }
.hl { padding:0 .12em; border-radius:10px; background:{{accent}}; color:{{bg}}; }
</style>

<div id="root" data-composition-id="{{id}}" data-width="{{width}}" data-height="{{height}}" data-duration="{{duration}}" data-start="0">
  <section id="main-clip" class="clip main-clip {{orientation}}" data-start="0" data-duration="{{duration}}" data-track-index="1">
    <div class="bg-fill"></div>
    <div class="bg-grid"></div>
    <div class="title">{{title}}</div>
    <div class="vm-plot"></div>
    <div class="vm-formula"></div>
    <div class="caption-zone"><div class="caption"></div></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
(function(){
  var root = document.getElementById('root');
  var DUR = parseFloat('{{duration}}') || 4;
  var VERT = '{{orientation}}' === 'vertical';
  function $(s){ return root.querySelector(s); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function hl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1<\/span>'); }

  var titleEl = $('.title');
  var tt = titleEl.textContent.trim();
  if (!tt) titleEl.style.display = 'none'; else titleEl.innerHTML = hl(tt);

  var ANALOGY = {{analogy}};
  var wordA = ANALOGY[0] || 'A', wordB = ANALOGY[1] || 'B', wordC = ANALOGY[2] || 'C', wordR = ANALOGY[3] || 'D';

  // Local-to-.vm-plot coordinates (never canvas-absolute) — same convention
  // vector-space.html uses for its scatter dots, since `.vm-plot` is itself
  // `position:absolute` and is therefore the containing block for any
  // `position:absolute` children placed inside it.
  var PW = VERT ? 912 : 1000, PH = VERT ? 800 : 520;
  // Fractions chosen so the arithmetic closes exactly: A - B + C = RESULT.
  var ORIGIN = { x: 0.10 * PW, y: 0.88 * PH };
  var A = { x: 0.42 * PW, y: 0.24 * PH };
  var B = { x: 0.30 * PW, y: 0.62 * PH };
  var C = { x: 0.62 * PW, y: 0.66 * PH };
  var R = { x: 0.74 * PW, y: 0.28 * PH };

  var plot = $('.vm-plot');
  var origin = document.createElement('div');
  origin.className = 'vm-origin';
  origin.style.left = ORIGIN.x + 'px'; origin.style.top = ORIGIN.y + 'px';
  plot.appendChild(origin);

  function vector(target, cls, word, isResult){
    var dx = target.x - ORIGIN.x, dy = target.y - ORIGIN.y;
    var len = Math.sqrt(dx*dx + dy*dy) || 1;
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    var shaft = document.createElement('div');
    shaft.className = 'vm-shaft' + (cls ? ' ' + cls : '');
    shaft.style.left = ORIGIN.x + 'px'; shaft.style.top = ORIGIN.y + 'px'; shaft.style.width = len + 'px';
    plot.appendChild(shaft);
    gsap.set(shaft, { rotation: ang, scaleX: 0, transformOrigin: 'left center' });

    var head = document.createElement('div');
    head.className = 'vm-head' + (isResult ? ' result' : '');
    head.style.left = target.x + 'px'; head.style.top = target.y + 'px';
    plot.appendChild(head);
    gsap.set(head, { rotation: ang, opacity: 0 });

    // Extra clearance beyond the tip: at the ≤10-char word cap a label pill
    // is wide enough to reach back and overlap the "−" sub-badge that sits
    // exactly at vector B's tip (found by the stress fixture at the limit).
    var labelDist = len + 70;
    var label = document.createElement('div');
    label.className = 'vm-label' + (isResult ? ' result' : '');
    label.textContent = word;
    label.style.left = (ORIGIN.x + Math.cos(ang * Math.PI / 180) * labelDist) + 'px';
    label.style.top = (ORIGIN.y + Math.sin(ang * Math.PI / 180) * labelDist) + 'px';
    plot.appendChild(label);

    return { shaft: shaft, head: head, label: label };
  }

  var vA = vector(A, '', wordA, false);
  var vB = vector(B, 'dashed', wordB, false);
  var vC = vector(C, '', wordC, false);
  var vR = vector(R, 'result', wordR, true);

  var subBadge = document.createElement('div');
  subBadge.className = 'vm-sub-badge';
  subBadge.textContent = '−';
  subBadge.style.left = B.x + 'px'; subBadge.style.top = B.y + 'px';
  plot.appendChild(subBadge);

  var formula = $('.vm-formula');
  formula.innerHTML = esc(wordA) + ' − ' + esc(wordB) + ' + ' + esc(wordC) + ' ≈ <span class="res">' + esc(wordR) + '<\/span>';

  var tl = gsap.timeline({ paused:true });
  tl.to($('.bg-grid'), { x:36, y:36, duration:DUR, ease:'none' }, 0);
  tl.fromTo(titleEl, { opacity:0, y:-24 }, { opacity:1, y:0, duration:0.32, ease:'power3.out' }, 0.08);
  tl.fromTo(plot, { opacity:0, scale:0.96 }, { opacity:1, scale:1, duration:0.32, ease:'power2.out' }, 0.2);
  tl.fromTo(origin, { opacity:0, scale:0 }, { opacity:1, scale:1, duration:0.22, ease:'back.out(2)' }, 0.35);

  // A and C draw first (the two positive terms), then B (the subtracted
  // term) gets its "−" badge, then the accent RESULT vector draws and lands.
  var at = 0.5;
  [vA, vC].forEach(function(v, i){
    tl.to(v.shaft, { scaleX:1, duration:0.3, ease:'power3.out' }, at + i * 0.22);
    tl.to(v.head, { opacity:1, duration:0.15 }, at + i * 0.22 + 0.24);
    tl.fromTo(v.label, { opacity:0, scale:0.7 }, { opacity:1, scale:1, duration:0.22, ease:'back.out(2)' }, at + i * 0.22 + 0.3);
  });
  var bAt = at + 0.5;
  tl.to(vB.shaft, { scaleX:1, duration:0.3, ease:'power3.out' }, bAt);
  tl.to(vB.head, { opacity:1, duration:0.15 }, bAt + 0.24);
  tl.fromTo(vB.label, { opacity:0, scale:0.7 }, { opacity:1, scale:1, duration:0.22, ease:'back.out(2)' }, bAt + 0.3);
  tl.fromTo(subBadge, { opacity:0, scale:0 }, { opacity:1, scale:1, duration:0.24, ease:'back.out(2.2)' }, bAt + 0.5);

  var formulaAt = bAt + 0.8;
  tl.to(formula, { opacity:1, duration:0.3 }, formulaAt);

  var resultAt = formulaAt + 0.35;
  tl.to(vR.shaft, { scaleX:1, duration:0.4, ease:'power3.out' }, resultAt);
  tl.to(vR.head, { opacity:1, duration:0.18 }, resultAt + 0.32);
  tl.fromTo(vR.label, { opacity:0, scale:0.6 }, { opacity:1, scale:1, duration:0.3, ease:'back.out(2.4)' }, resultAt + 0.4);
  tl.fromTo(vR.label, { scale:1 }, { scale:1.15, duration:0.18, yoyo:true, repeat:1 }, resultAt + 0.7);

  // B-roll: the result vector holds a soft glow breathing for the remainder.
  var idleAt = resultAt + 1.0;
  var pulses = Math.max(1, Math.floor((DUR - idleAt) / 0.85));
  tl.to(vR.shaft, { boxShadow: '0 0 30px {{accent}}cc', duration:0.42, ease:'sine.inOut', repeat:pulses * 2 - 1, yoyo:true }, idleAt);

  var CT = {{captionTiming}};
  var capHost = $('.caption');
  var caps = (Array.isArray(CT) ? CT : []).map(function(c){
    var d = document.createElement('div');
    d.className = 'cap-chunk';
    var ws = Array.isArray(c.words) ? c.words : [];
    d.innerHTML = ws.length
      ? ws.map(function(w){ return '<span class="cw">' + hl(w.text) + ' </span>'; }).join('')
      : hl(c.text);
    capHost.appendChild(d);
    return d;
  });
  caps.forEach(function(el, i){
    var t = CT[i]; if(!t) return;
    if(i < caps.length - 1){
      var nextStart = CT[i+1] ? CT[i+1].start : t.end;
      var gap = Math.max(0.02, nextStart - t.start);
      var fadeOutDur = Math.min(0.12, gap);
      var fadeInDur = Math.min(i===0?0.2:0.18, Math.max(0.01, gap - fadeOutDur));
      tl.to(el, { opacity:1, duration:fadeInDur }, t.start);
      tl.to(el, { opacity:0, duration:fadeOutDur }, nextStart - fadeOutDur);
    } else {
      tl.to(el, { opacity:1, duration:i===0?0.2:0.18 }, t.start);
    }
    // Karaoke: only the word being spoken holds the highlight color; every
    // other word keeps the normal caption color. Emphasis pills (.hl) opt out.
    var ws = Array.isArray(t.words) ? t.words : [];
    var spans = el.querySelectorAll('.cw');
    ws.forEach(function(w, wi){
      var span = spans[wi]; if(!span || span.querySelector('.hl')) return;
      tl.to(span, { color:'{{capHighlight}}', duration:0.12, ease:'power2.out' }, w.start);
      tl.to(span, { color:'{{fg}}', duration:0.15 }, Math.max(w.start + 0.12, w.end));
    });
  });

  window.__timelines['{{id}}'] = tl;
})();
</script>
</template>
</body>
</html>
</content>
