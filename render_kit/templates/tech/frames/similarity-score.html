<!doctype html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;800&display=swap");
#root { position:absolute; inset:0; width:{{width}}px; height:{{height}}px; background:{{bg}}; color:{{fg}}; overflow:hidden; font-family:'Space Grotesk','Inter',sans-serif; }
#main-clip.vertical   { --pad:84px;  --title-size:76px; --card-size:38px; --readout-size:88px; --cap-size:58px; --cap-bottom:170px; --cap-maxw:100%; }
#main-clip.horizontal { --pad:130px; --title-size:70px; --card-size:34px; --readout-size:76px; --cap-size:44px; --cap-bottom:70px;  --cap-maxw:1180px; }

.bg-fill { pointer-events:none; position:absolute; inset:0; background:{{bg}}; }
.bg-grid { pointer-events:none; position:absolute; inset:-140px; opacity:.9;
  background-image:radial-gradient(rgba(230,237,243,.08) 2px, transparent 2px);
  background-size:54px 54px; }

.title { position:absolute; z-index:2; left:var(--pad); right:var(--pad); font-weight:700; font-size:var(--title-size); line-height:1.05; letter-spacing:-1px; }
#main-clip.vertical .title   { top:250px; text-align:center; }
#main-clip.horizontal .title { top:120px; text-align:left; }

.ss-card { position:absolute; z-index:2; background:#161B22; border:2px solid rgba(230,237,243,.18); border-radius:16px; padding:22px 28px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:var(--card-size); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; box-shadow:0 12px 32px rgba(0,0,0,.35); }
#main-clip.vertical .ss-card.c0   { left:var(--pad); right:var(--pad); top:440px; }
#main-clip.vertical .ss-card.c1   { left:var(--pad); right:var(--pad); top:558px; }
#main-clip.horizontal .ss-card.c0 { left:130px; width:560px; top:340px; }
#main-clip.horizontal .ss-card.c1 { left:130px; width:560px; top:458px; }

.ss-gauge { position:absolute; z-index:2; }
#main-clip.vertical .ss-gauge   { left:260px; top:720px; width:560px; height:280px; }
#main-clip.horizontal .ss-gauge { left:1310px; top:310px; width:440px; height:220px; }
.ss-gauge-svg { position:absolute; inset:0; overflow:visible; }
.ss-arc { fill:none; stroke:rgba(230,237,243,.16); stroke-width:14; stroke-linecap:round; }
.ss-thresh { stroke:rgba(230,237,243,.4); stroke-width:5; }
.ss-needle { position:absolute; left:50%; bottom:0; width:10px; margin-left:-5px; border-radius:5px 5px 2px 2px; background:{{accent}}; transform-origin:bottom center; box-shadow:0 0 18px {{accent}}88; }

.ss-readout { position:absolute; z-index:2; text-align:center; font-family:'JetBrains Mono',monospace; font-weight:800; font-size:var(--readout-size); color:{{fg}}; }
#main-clip.vertical .ss-readout   { left:260px; width:560px; top:1030px; }
#main-clip.horizontal .ss-readout { left:1310px; width:440px; top:550px; }
.ss-readout.match { color:{{accent}}; }

.caption-zone { position:absolute; bottom:var(--cap-bottom); left:0; right:0; display:flex; align-items:center; justify-content:center; z-index:5; }
.caption { position:relative; width:calc(100% - 2*var(--pad)); max-width:var(--cap-maxw); height:2.4em; font-size:var(--cap-size); }
.cap-chunk { position:absolute; width:100%; left:0; top:50%; transform:translateY(-50%); font-family:'Inter',sans-serif; font-weight:800; text-align:center; line-height:1.3; opacity:0; }
.cap-chunk .cw { display:inline-block; white-space:pre; }
.hl { padding:0 .12em; border-radius:10px; background:{{accent}}; color:{{bg}}; }
</style>

<div id="root" data-composition-id="{{id}}" data-width="{{width}}" data-height="{{height}}" data-duration="{{duration}}" data-start="0">
  <section id="main-clip" class="clip main-clip {{orientation}}" data-start="0" data-duration="{{duration}}" data-track-index="1">
    <div class="bg-fill"></div>
    <div class="bg-grid"></div>
    <div class="title">{{title}}</div>
    <div class="ss-card c0"></div>
    <div class="ss-card c1"></div>
    <div class="ss-gauge">
      <svg class="ss-gauge-svg"></svg>
      <div class="ss-needle"></div>
    </div>
    <div class="ss-readout"></div>
    <div class="caption-zone"><div class="caption"></div></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
(function(){
  var root = document.getElementById('root');
  var DUR = parseFloat('{{duration}}') || 4;
  var VERT = '{{orientation}}' === 'vertical';
  function $(s){ return root.querySelector(s); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function hl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1<\/span>'); }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  var SVGNS = 'http://www.w3.org/2000/svg';

  var titleEl = $('.title');
  var tt = titleEl.textContent.trim();
  if (!tt) titleEl.style.display = 'none'; else titleEl.innerHTML = hl(tt);

  var PHRASES = {{phrases}};
  // Cards are esc()-only (no ** markup) — these are quoted source text, not
  // authored display copy.
  $('.ss-card.c0').textContent = PHRASES[0] || '';
  $('.ss-card.c1').textContent = PHRASES[1] || '';

  var SCORE = clamp(Number('{{score}}') || 0, 0, 1);
  var THRESHOLD = clamp(Number('{{threshold}}') || 0.75, 0, 1);
  function angleFor(v){ return (v - 0.5) * 180; } // -90..+90, 0 = straight up

  // Semicircle gauge: viewBox is exactly 2r wide, r tall, so the pivot
  // (center of the diameter) sits at local (50%, 100%) — the same anchor
  // used by the needle's `left:50%; bottom:0`. No canvas-space coordinates
  // anywhere in this frame; everything is parent-relative.
  var gaugeEl = $('.ss-gauge');
  var GW = VERT ? 560 : 440; // matches the CSS width above (no DOM measurement)
  var r = GW / 2;
  var svg = $('.ss-gauge-svg');
  svg.setAttribute('viewBox', '0 0 ' + GW + ' ' + r);
  svg.setAttribute('width', GW);
  svg.setAttribute('height', r);

  var arc = document.createElementNS(SVGNS, 'path');
  arc.setAttribute('class', 'ss-arc');
  arc.setAttribute('d', 'M 0 ' + r + ' A ' + r + ' ' + r + ' 0 0 1 ' + GW + ' ' + r);
  svg.appendChild(arc);

  // Threshold tick: a short radial line at the threshold angle, drawn from
  // the outer arc radius inward.
  var ta = angleFor(THRESHOLD) * Math.PI / 180;
  var tx0 = r + r * Math.sin(ta), ty0 = r - r * Math.cos(ta);
  var tx1 = r + (r * 0.78) * Math.sin(ta), ty1 = r - (r * 0.78) * Math.cos(ta);
  var thresh = document.createElementNS(SVGNS, 'line');
  thresh.setAttribute('class', 'ss-thresh');
  thresh.setAttribute('x1', tx0); thresh.setAttribute('y1', ty0);
  thresh.setAttribute('x2', tx1); thresh.setAttribute('y2', ty1);
  svg.appendChild(thresh);

  var needle = $('.ss-needle');
  needle.style.height = Math.round(r * 0.82) + 'px';
  var passed = SCORE >= THRESHOLD;

  var readout = $('.ss-readout');
  readout.textContent = SCORE.toFixed(2);

  var tl = gsap.timeline({ paused:true });
  tl.to($('.bg-grid'), { x:36, y:36, duration:DUR, ease:'none' }, 0);
  tl.fromTo(titleEl, { opacity:0, y:-24 }, { opacity:1, y:0, duration:0.32, ease:'power3.out' }, 0.08);

  // Cards slide in from opposite sides (stacked V / stacked H — same axis
  // both orientations here since the gauge, not the cards, splits the
  // layout in horizontal).
  tl.fromTo($('.ss-card.c0'), { opacity:0, x:-40 }, { opacity:1, x:0, duration:0.32, ease:'power2.out' }, 0.2);
  tl.fromTo($('.ss-card.c1'), { opacity:0, x:40 }, { opacity:1, x:0, duration:0.32, ease:'power2.out' }, 0.32);

  // Gauge face fades in, then the needle sweeps from zero to the score —
  // inserted before the threshold tick in DOM so the tick paints on top.
  var gaugeAt = 0.55;
  tl.fromTo(gaugeEl, { opacity:0, scale:0.94 }, { opacity:1, scale:1, duration:0.3, ease:'power2.out' }, gaugeAt);
  gsap.set(needle, { rotation: angleFor(0) });
  var sweepAt = gaugeAt + 0.25;
  tl.to(needle, { rotation: angleFor(SCORE), duration:0.55, ease:'power3.out' }, sweepAt);

  // Readout counts up in sync with the sweep, then snaps to accent the
  // instant it crosses the threshold.
  gsap.set(readout, { opacity:0 });
  tl.to(readout, { opacity:1, duration:0.2 }, sweepAt);
  var counter = { v: 0 };
  tl.to(counter, {
    v: SCORE, duration:0.55, ease:'power3.out',
    onUpdate: function(){
      readout.textContent = counter.v.toFixed(2);
      // Recomputed on every render (including seeks/scrubs, not just
      // forward playback), so the snap is correct regardless of where the
      // inspector or renderer samples this timeline.
      if (counter.v >= THRESHOLD) readout.classList.add('match');
      else readout.classList.remove('match');
    },
  }, sweepAt);
  if (passed) {
    tl.fromTo(readout, { scale:1 }, { scale:1.18, duration:0.18, yoyo:true, repeat:1 }, sweepAt + 0.55);
  }

  // B-roll: needle holds with a faint idle glow pulse.
  var idleAt = sweepAt + 0.8;
  var pulses = Math.max(1, Math.floor((DUR - idleAt) / 0.9));
  tl.to(needle, { boxShadow: '0 0 30px {{accent}}cc', duration:0.45, ease:'sine.inOut', repeat:pulses * 2 - 1, yoyo:true }, idleAt);

  var CT = {{captionTiming}};
  var capHost = $('.caption');
  var caps = (Array.isArray(CT) ? CT : []).map(function(c){
    var d = document.createElement('div');
    d.className = 'cap-chunk';
    var ws = Array.isArray(c.words) ? c.words : [];
    d.innerHTML = ws.length
      ? ws.map(function(w){ return '<span class="cw">' + hl(w.text) + ' </span>'; }).join('')
      : hl(c.text);
    capHost.appendChild(d);
    return d;
  });
  caps.forEach(function(el, i){
    var t = CT[i]; if(!t) return;
    if(i < caps.length - 1){
      var nextStart = CT[i+1] ? CT[i+1].start : t.end;
      var gap = Math.max(0.02, nextStart - t.start);
      var fadeOutDur = Math.min(0.12, gap);
      var fadeInDur = Math.min(i===0?0.2:0.18, Math.max(0.01, gap - fadeOutDur));
      tl.to(el, { opacity:1, duration:fadeInDur }, t.start);
      tl.to(el, { opacity:0, duration:fadeOutDur }, nextStart - fadeOutDur);
    } else {
      tl.to(el, { opacity:1, duration:i===0?0.2:0.18 }, t.start);
    }
    // Karaoke: only the word being spoken holds the highlight color; every
    // other word keeps the normal caption color. Emphasis pills (.hl) opt out.
    var ws = Array.isArray(t.words) ? t.words : [];
    var spans = el.querySelectorAll('.cw');
    ws.forEach(function(w, wi){
      var span = spans[wi]; if(!span || span.querySelector('.hl')) return;
      tl.to(span, { color:'{{capHighlight}}', duration:0.12, ease:'power2.out' }, w.start);
      tl.to(span, { color:'{{fg}}', duration:0.15 }, Math.max(w.start + 0.12, w.end));
    });
  });

  window.__timelines['{{id}}'] = tl;
})();
</script>
</template>
</body>
</html>
</content>
