<!doctype html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;800&display=swap");
#root { position:absolute; inset:0; width:{{width}}px; height:{{height}}px; background:{{bg}}; color:{{fg}}; overflow:hidden; font-family:'Space Grotesk','Inter',sans-serif; }
#main-clip.vertical   { --pad:84px;  --title-size:76px; --cap-size:58px; --cap-bottom:170px; --cap-maxw:100%; }
#main-clip.horizontal { --pad:130px; --title-size:70px; --cap-size:44px; --cap-bottom:70px;  --cap-maxw:1180px; }

.bg-fill { pointer-events:none; position:absolute; inset:0; background:{{bg}}; }
.bg-grid { pointer-events:none; position:absolute; inset:-140px; opacity:.9;
  background-image:radial-gradient(rgba(230,237,243,.08) 2px, transparent 2px);
  background-size:54px 54px; }

.title { position:absolute; z-index:2; left:var(--pad); right:var(--pad); font-weight:700; font-size:var(--title-size); line-height:1.05; letter-spacing:-1px; }
#main-clip.vertical .title   { top:250px; text-align:center; }
#main-clip.horizontal .title { top:120px; text-align:left; }

.arc-svg { position:absolute; z-index:2; pointer-events:none; }
.arc-path { fill:none; stroke:{{accent}}; stroke-linecap:round; }

.tok-row { position:absolute; z-index:3; }
.arc-tok { position:absolute; white-space:nowrap; font-weight:700; color:{{fg}}; opacity:.55; }
.arc-tok.focus { opacity:1; color:{{bg}}; background:{{accent}}; padding:.14em .32em; border-radius:10px; box-shadow:0 0 0 rgba(0,0,0,0); }

.caption-zone { position:absolute; bottom:var(--cap-bottom); left:0; right:0; display:flex; align-items:center; justify-content:center; z-index:5; }
.caption { position:relative; width:calc(100% - 2*var(--pad)); max-width:var(--cap-maxw); height:2.4em; font-size:var(--cap-size); }
.cap-chunk { position:absolute; width:100%; left:0; top:50%; transform:translateY(-50%); font-family:'Inter',sans-serif; font-weight:800; text-align:center; line-height:1.3; opacity:0; }
.cap-chunk .cw { display:inline-block; white-space:pre; }
.hl { padding:0 .12em; border-radius:10px; background:{{accent}}; color:{{bg}}; }
</style>

<div id="root" data-composition-id="{{id}}" data-width="{{width}}" data-height="{{height}}" data-duration="{{duration}}" data-start="0">
  <section id="main-clip" class="clip main-clip {{orientation}}" data-start="0" data-duration="{{duration}}" data-track-index="1">
    <div class="bg-fill"></div>
    <div class="bg-grid"></div>
    <div class="title">{{title}}</div>
    <div class="tok-row"></div>
    <div class="caption-zone"><div class="caption"></div></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
(function(){
  var root = document.getElementById('root');
  var W = {{width}}, H = {{height}};
  var DUR = parseFloat('{{duration}}') || 4;
  var VERT = '{{orientation}}' === 'vertical';
  function $(s){ return root.querySelector(s); }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function hl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1<\/span>'); }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  var titleEl = $('.title');
  var tt = titleEl.textContent.trim();
  if (!tt) titleEl.style.display = 'none'; else titleEl.innerHTML = hl(tt);

  var TOKENS = {{tokens}};
  var RAW_WEIGHTS = {{weights}};
  var FOCUS = clamp(Math.round(Number('{{highlightIndex}}')), 0, Math.max(0, TOKENS.length - 1));
  if (!Number.isFinite(FOCUS)) FOCUS = Math.floor((TOKENS.length - 1) / 2);
  var n = TOKENS.length;

  // Deterministic layout: even index-based spacing (never measured text
  // width) along a fixed baseline, arcs arching into a fixed band above it.
  var LAY = VERT
    ? { x0:120, x1:960, baselineY:1200, apexMinY:560 }
    : { x0:220, x1:1700, baselineY:780,  apexMinY:340 };
  var slotW = (LAY.x1 - LAY.x0) / Math.max(1, n);
  function tokX(i){ return LAY.x0 + (i + 0.5) * slotW; }

  // Arithmetic font fit for the token row — no DOM measurement, sized from
  // the longest token so the row never overlaps within its even-spaced slots.
  function fitFont(chars, usableW, baseFs, adv, gutterEm){
    return Math.max(20, Math.min(baseFs, Math.floor(usableW / (adv * chars + gutterEm))));
  }
  var maxChars = TOKENS.reduce(function(m, t){ return Math.max(m, String(t).length); }, 1);
  var baseFs = VERT ? 42 : 38;
  var fs = fitFont(maxChars, slotW, baseFs, 0.62, 1.2);

  var row = $('.tok-row');
  var tokEls = TOKENS.map(function(t, i){
    var el = document.createElement('div');
    el.className = 'arc-tok' + (i === FOCUS ? ' focus' : '');
    el.style.left = tokX(i) + 'px';
    el.style.top = LAY.baselineY + 'px';
    el.style.fontSize = fs + 'px';
    el.textContent = t;
    gsap.set(el, { xPercent:-50, yPercent:-50 });
    row.appendChild(el);
    return el;
  });

  // Attention weights: author-supplied if it matches token count, else a
  // baked falloff by distance from the focus token — always deterministic.
  function weightFor(j){
    if (Array.isArray(RAW_WEIGHTS) && RAW_WEIGHTS.length === n) {
      var w = Number(RAW_WEIGHTS[j]);
      return Number.isFinite(w) ? clamp(w, 0, 1) : 0;
    }
    return clamp(0.85 - 0.15 * Math.abs(FOCUS - j), 0.12, 0.85);
  }

  // Inline SVG holds ONLY <path> elements (no text), sized to an explicit
  // box so nothing can overflow it, and sits before .tok-row in DOM so the
  // token chips always paint on top — arcs can never occlude token text.
  var svgLeft = LAY.x0, svgTop = LAY.apexMinY;
  var svgW = LAY.x1 - LAY.x0, svgH = LAY.baselineY - LAY.apexMinY;
  var svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('class', 'arc-svg');
  svg.setAttribute('width', svgW);
  svg.setAttribute('height', svgH);
  svg.setAttribute('viewBox', '0 0 ' + svgW + ' ' + svgH);
  svg.style.left = svgLeft + 'px';
  svg.style.top = svgTop + 'px';
  root.querySelector('#main-clip').insertBefore(svg, row);

  var ANCHOR_INSET = 14; // arcs leave the token's top edge, not its center
  var arcs = [];
  for (var j = 0; j < n; j++) {
    if (j === FOCUS) continue;
    var w = weightFor(j);
    var xi = tokX(FOCUS) - svgLeft, xj = tokX(j) - svgLeft;
    var yBase = LAY.baselineY - svgTop - ANCHOR_INSET;
    var dist = Math.abs(FOCUS - j);
    var arcH = clamp(70 + 46 * dist, 70, svgH - 10);
    var mx = (xi + xj) / 2, my = yBase - arcH;
    var path = document.createElementNS(SVGNS, 'path');
    path.setAttribute('class', 'arc-path');
    path.setAttribute('d', 'M ' + xi + ' ' + yBase + ' Q ' + mx + ' ' + my + ' ' + xj + ' ' + yBase);
    path.setAttribute('stroke-width', 2 + 16 * w);
    path.style.opacity = 0.25 + 0.6 * w;
    svg.appendChild(path);
    var len = path.getTotalLength(); // geometry of the path's own `d`, not a layout read — deterministic
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    arcs.push({ el: path, len: len, j: j, dist: dist });
  }
  arcs.sort(function(a, b){ return a.dist - b.dist; });

  var tl = gsap.timeline({ paused:true });
  tl.to($('.bg-grid'), { x:36, y:36, duration:DUR, ease:'none' }, 0);
  tl.fromTo(titleEl, { opacity:0, y:-24 }, { opacity:1, y:0, duration:0.32, ease:'power3.out' }, 0.08);

  // Tokens land together as a row so the scene is never empty early.
  tl.fromTo(tokEls, { opacity:0, y:16 }, { opacity:function(i){ return i === FOCUS ? 1 : 0.55; }, y:0, duration:0.3, stagger:0.03, ease:'power2.out' }, 0.2);

  // Focus token pulses once it's landed, then the arcs draw outward from it.
  var focusEl = tokEls[FOCUS];
  var arcsAt = 0.2 + n * 0.03 + 0.25;
  if (focusEl) tl.fromTo(focusEl, { scale:1 }, { scale:1.12, duration:0.22, ease:'back.out(2)', yoyo:true, repeat:1 }, arcsAt - 0.15);
  var arcSpan = Math.min(DUR * 0.35, Math.max(0.7, arcs.length * 0.18));
  var arcPer = arcSpan / Math.max(1, arcs.length);
  arcs.forEach(function(a, i){
    tl.to(a.el, { strokeDashoffset:0, duration:0.32, ease:'power2.out' }, arcsAt + i * arcPer);
  });

  // B-roll: the focus token keeps a soft glow breathing for the rest of the scene.
  var idleAt = arcsAt + arcSpan + 0.2;
  var pulses = Math.max(1, Math.floor((DUR - idleAt) / 0.8));
  if (focusEl) tl.to(focusEl, { scale:1.05, duration:0.4, ease:'sine.inOut', repeat:pulses * 2 - 1, yoyo:true }, idleAt);

  var CT = {{captionTiming}};
  var capHost = $('.caption');
  var caps = (Array.isArray(CT) ? CT : []).map(function(c){
    var d = document.createElement('div');
    d.className = 'cap-chunk';
    var ws = Array.isArray(c.words) ? c.words : [];
    d.innerHTML = ws.length
      ? ws.map(function(w){ return '<span class="cw">' + hl(w.text) + ' </span>'; }).join('')
      : hl(c.text);
    capHost.appendChild(d);
    return d;
  });
  caps.forEach(function(el, i){
    var t = CT[i]; if(!t) return;
    if(i < caps.length - 1){
      var nextStart = CT[i+1] ? CT[i+1].start : t.end;
      var gap = Math.max(0.02, nextStart - t.start);
      var fadeOutDur = Math.min(0.12, gap);
      var fadeInDur = Math.min(i===0?0.2:0.18, Math.max(0.01, gap - fadeOutDur));
      tl.to(el, { opacity:1, duration:fadeInDur }, t.start);
      tl.to(el, { opacity:0, duration:fadeOutDur }, nextStart - fadeOutDur);
    } else {
      tl.to(el, { opacity:1, duration:i===0?0.2:0.18 }, t.start);
    }
    // Karaoke: only the word being spoken holds the highlight color; every
    // other word keeps the normal caption color. Emphasis pills (.hl) opt out.
    var ws = Array.isArray(t.words) ? t.words : [];
    var spans = el.querySelectorAll('.cw');
    ws.forEach(function(w, wi){
      var span = spans[wi]; if(!span || span.querySelector('.hl')) return;
      tl.to(span, { color:'{{capHighlight}}', duration:0.12, ease:'power2.out' }, w.start);
      tl.to(span, { color:'{{fg}}', duration:0.15 }, Math.max(w.start + 0.12, w.end));
    });
  });

  window.__timelines['{{id}}'] = tl;
})();
</script>
</template>
</body>
</html>
</content>
