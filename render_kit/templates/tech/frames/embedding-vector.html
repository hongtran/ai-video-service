<!doctype html>
<html>
<head><meta charset="UTF-8" /></head>
<body>
<template>
<style>
@import url("https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;700;800&display=swap");
#root { position:absolute; inset:0; width:{{width}}px; height:{{height}}px; background:{{bg}}; color:{{fg}}; overflow:hidden; font-family:'Space Grotesk','Inter',sans-serif; }
#main-clip.vertical   { --pad:84px;  --title-size:76px; --chip-size:44px; --cell-num:22px; --dims-size:34px; --cap-size:58px; --cap-bottom:170px; --cap-maxw:100%; }
#main-clip.horizontal { --pad:130px; --title-size:70px; --chip-size:40px; --cell-num:20px; --dims-size:30px; --cap-size:44px; --cap-bottom:70px;  --cap-maxw:1180px; }

.bg-fill { pointer-events:none; position:absolute; inset:0; background:{{bg}}; }
.bg-grid { pointer-events:none; position:absolute; inset:-140px; opacity:.9;
  background-image:radial-gradient(rgba(230,237,243,.08) 2px, transparent 2px);
  background-size:54px 54px; }

.title { position:absolute; z-index:2; left:var(--pad); right:var(--pad); font-weight:700; font-size:var(--title-size); line-height:1.05; letter-spacing:-1px; }
#main-clip.vertical .title   { top:250px; text-align:center; }
#main-clip.horizontal .title { top:120px; text-align:left; }

.ev-chip { position:absolute; z-index:2; background:#161B22; border:2px solid rgba(230,237,243,.2); border-radius:16px; padding:20px 32px; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:var(--chip-size); white-space:nowrap; box-shadow:0 14px 36px rgba(0,0,0,.4); }
#main-clip.vertical .ev-chip   { left:50%; top:470px; transform:translateX(-50%); }
#main-clip.horizontal .ev-chip { left:130px; top:460px; }

.ev-arrow { position:absolute; z-index:2; background:rgba(230,237,243,.3); }
#main-clip.vertical .ev-arrow   { left:50%; top:600px; width:4px; height:110px; margin-left:-2px; transform-origin:top center; }
#main-clip.horizontal .ev-arrow { left:430px; top:485px; width:230px; height:4px; transform-origin:left center; }
.ev-arrowhead { position:absolute; z-index:2; width:0; height:0; }
#main-clip.vertical .ev-arrowhead   { left:50%; top:706px; margin-left:-14px; border-left:14px solid transparent; border-right:14px solid transparent; border-top:18px solid rgba(230,237,243,.3); }
#main-clip.horizontal .ev-arrowhead { left:656px; top:471px; border-top:14px solid transparent; border-bottom:14px solid transparent; border-left:18px solid rgba(230,237,243,.3); }

.ev-heatmap { position:absolute; z-index:2; display:flex; gap:10px; }
#main-clip.vertical .ev-heatmap   { left:var(--pad); right:var(--pad); top:790px; }
#main-clip.horizontal .ev-heatmap { left:730px; right:130px; top:400px; }
.ev-cell { flex:1 1 0; min-width:0; aspect-ratio:1/1.15; border-radius:10px; border:1px solid rgba(230,237,243,.14); display:flex; align-items:center; justify-content:center; opacity:0; }
.ev-cell-val { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:var(--cell-num); color:{{fg}}; }

.ev-dims { position:absolute; z-index:2; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:var(--dims-size); opacity:.7; }
#main-clip.vertical .ev-dims   { left:var(--pad); right:var(--pad); top:960px; text-align:center; }
#main-clip.horizontal .ev-dims { left:730px; top:575px; }

.caption-zone { position:absolute; bottom:var(--cap-bottom); left:0; right:0; display:flex; align-items:center; justify-content:center; z-index:5; }
.caption { position:relative; width:calc(100% - 2*var(--pad)); max-width:var(--cap-maxw); height:2.4em; font-size:var(--cap-size); }
.cap-chunk { position:absolute; width:100%; left:0; top:50%; transform:translateY(-50%); font-family:'Inter',sans-serif; font-weight:800; text-align:center; line-height:1.3; opacity:0; }
.cap-chunk .cw { display:inline-block; white-space:pre; }
.hl { padding:0 .12em; border-radius:10px; background:{{accent}}; color:{{bg}}; }
</style>

<div id="root" data-composition-id="{{id}}" data-width="{{width}}" data-height="{{height}}" data-duration="{{duration}}" data-start="0">
  <section id="main-clip" class="clip main-clip {{orientation}}" data-start="0" data-duration="{{duration}}" data-track-index="1">
    <div class="bg-fill"></div>
    <div class="bg-grid"></div>
    <div class="title">{{title}}</div>
    <div class="ev-chip"></div>
    <div class="ev-arrow"></div>
    <div class="ev-arrowhead"></div>
    <div class="ev-heatmap"></div>
    <div class="ev-dims"><span class="dn">0</span>-d</div>
    <div class="caption-zone"><div class="caption"></div></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script>
window.__timelines = window.__timelines || {};
(function(){
  var root = document.getElementById('root');
  var DUR = parseFloat('{{duration}}') || 4;
  var VERT = '{{orientation}}' === 'vertical';
  function $(s){ return root.querySelector(s); }
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function hl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,'<span class="hl">$1<\/span>'); }
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  var titleEl = $('.title');
  var tt = titleEl.textContent.trim();
  if (!tt) titleEl.style.display = 'none'; else titleEl.innerHTML = hl(tt);

  var PHRASES = {{phrases}};
  var RAW_VALUES = {{values}};
  var DIMS = Math.max(1, Math.round(Number('{{dims}}')) || 1536);

  var phrase = PHRASES[0] || '';
  $('.ev-chip').textContent = phrase;

  // Deterministic baked wave (no Math.random) when no illustrative values
  // are authored — a smooth, varied-looking sequence that reproduces
  // identically on every render.
  var n = (Array.isArray(RAW_VALUES) && RAW_VALUES.length >= 6) ? Math.min(12, RAW_VALUES.length) : 8;
  var VALUES = [];
  for (var i = 0; i < n; i++) {
    var v = Array.isArray(RAW_VALUES) && RAW_VALUES[i] !== undefined ? Number(RAW_VALUES[i]) : Math.sin(i * 1.37) * 0.8;
    VALUES.push(clamp(Number.isFinite(v) ? v : 0, -1, 1));
  }

  var heatmap = $('.ev-heatmap');
  var cells = VALUES.map(function(v){
    var mag = Math.abs(v);
    var el = document.createElement('div');
    el.className = 'ev-cell';
    el.style.background = '{{accent}}' + Math.round(mag * 210).toString(16).padStart(2, '0');
    el.innerHTML = '<span class="ev-cell-val">' + v.toFixed(2) + '<\/span>';
    heatmap.appendChild(el);
    return el;
  });

  var tl = gsap.timeline({ paused:true });
  tl.to($('.bg-grid'), { x:36, y:36, duration:DUR, ease:'none' }, 0);
  tl.fromTo(titleEl, { opacity:0, y:-24 }, { opacity:1, y:0, duration:0.32, ease:'power3.out' }, 0.08);

  // The chip flies in, then the arrow draws down/across to the heatmap.
  tl.fromTo($('.ev-chip'), { opacity:0, y:-20, scale:0.9 }, { opacity:1, y:0, scale:1, duration:0.32, ease:'back.out(1.8)' }, 0.2);
  var arrowAt = 0.55;
  tl.fromTo($('.ev-arrow'), VERT ? { scaleY:0 } : { scaleX:0 }, { scaleY:1, scaleX:1, duration:0.22, ease:'power2.out' }, arrowAt);
  tl.fromTo($('.ev-arrowhead'), { opacity:0 }, { opacity:1, duration:0.15 }, arrowAt + 0.18);

  // Cells populate left to right, heat bloom scales each cell up briefly.
  var cellsAt = arrowAt + 0.35;
  var cellSpan = Math.min(DUR * 0.35, Math.max(0.7, cells.length * 0.09));
  var cellPer = cellSpan / Math.max(1, cells.length);
  cells.forEach(function(cell, i){
    var at = cellsAt + i * cellPer;
    tl.fromTo(cell, { opacity:0, scale:0.6 }, { opacity:1, scale:1, duration:0.22, ease:'back.out(2)' }, at);
    tl.fromTo(cell, { scale:1 }, { scale:1.12, duration:0.16, yoyo:true, repeat:1 }, at + 0.1);
  });

  // Dimension counter counts up once the last cell has bloomed.
  var dimsAt = cellsAt + cellSpan + 0.15;
  var dimsEl = $('.ev-dims');
  var dnEl = $('.dn');
  gsap.set(dimsEl, { opacity: 0 });
  tl.to(dimsEl, { opacity:1, duration:0.2 }, dimsAt);
  var counter = { v: 0 };
  tl.to(counter, {
    v: DIMS, duration:0.5, ease:'power2.out',
    onUpdate: function(){ dnEl.textContent = Math.round(counter.v); },
  }, dimsAt);

  // B-roll: cells breathe gently for the remainder of the scene.
  var idleAt = dimsAt + 0.6;
  var pulses = Math.max(1, Math.floor((DUR - idleAt) / 1.0));
  tl.to(cells, { scale:1.04, duration:0.5, ease:'sine.inOut', repeat:pulses * 2 - 1, yoyo:true, stagger:0.03 }, idleAt);

  var CT = {{captionTiming}};
  var capHost = $('.caption');
  var caps = (Array.isArray(CT) ? CT : []).map(function(c){
    var d = document.createElement('div');
    d.className = 'cap-chunk';
    var ws = Array.isArray(c.words) ? c.words : [];
    d.innerHTML = ws.length
      ? ws.map(function(w){ return '<span class="cw">' + hl(w.text) + ' </span>'; }).join('')
      : hl(c.text);
    capHost.appendChild(d);
    return d;
  });
  caps.forEach(function(el, i){
    var t = CT[i]; if(!t) return;
    if(i < caps.length - 1){
      var nextStart = CT[i+1] ? CT[i+1].start : t.end;
      var gap = Math.max(0.02, nextStart - t.start);
      var fadeOutDur = Math.min(0.12, gap);
      var fadeInDur = Math.min(i===0?0.2:0.18, Math.max(0.01, gap - fadeOutDur));
      tl.to(el, { opacity:1, duration:fadeInDur }, t.start);
      tl.to(el, { opacity:0, duration:fadeOutDur }, nextStart - fadeOutDur);
    } else {
      tl.to(el, { opacity:1, duration:i===0?0.2:0.18 }, t.start);
    }
    // Karaoke: only the word being spoken holds the highlight color; every
    // other word keeps the normal caption color. Emphasis pills (.hl) opt out.
    var ws = Array.isArray(t.words) ? t.words : [];
    var spans = el.querySelectorAll('.cw');
    ws.forEach(function(w, wi){
      var span = spans[wi]; if(!span || span.querySelector('.hl')) return;
      tl.to(span, { color:'{{capHighlight}}', duration:0.12, ease:'power2.out' }, w.start);
      tl.to(span, { color:'{{fg}}', duration:0.15 }, Math.max(w.start + 0.12, w.end));
    });
  });

  window.__timelines['{{id}}'] = tl;
})();
</script>
</template>
</body>
</html>
</content>
