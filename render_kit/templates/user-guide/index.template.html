<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width={{width}}, height={{height}}" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: {{width}}px;
        height: {{height}}px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: {{width}}px;
        height: {{height}}px;
        overflow: hidden;
        background: #000;
      }
      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      /* The screen recording. `contain` never crops — cropping a UI recording
         removes the thing being demonstrated. The blurred, scaled-up copy
         behind it fills the letterbox bars so an off-aspect recording doesn't
         sit in dead black. Neither is ever transformed by a scene: a Ken-Burns
         push on a screen recording makes small UI text unreadable. */
      #el-screencast {
        object-fit: contain;
        z-index: 1;
      }
      #el-screencast-bg {
        object-fit: cover;
        filter: blur(48px) brightness(0.4) saturate(0.7);
        transform: scale(1.15);
        z-index: 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="{{totalDuration}}"
      data-width="{{width}}"
      data-height="{{height}}"
    >
      <!-- SCREENCAST_PLACEHOLDER -->

      <!-- SCENES_PLACEHOLDER -->

      <!-- AUDIO_PLACEHOLDER -->
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      (function () {
        var tl = window.__timelines["main"];
        // TRANSITIONS_PLACEHOLDER
        tl.to({}, { duration: {{totalDuration}} }, 0);
      })();
    </script>
  </body>
</html>
